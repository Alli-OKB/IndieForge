<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndieForge - Gestion de Workspaces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="card-padding flex-between">
        <div class="logo-container">
            <img src="logo.png" alt="IndieForge Logo" class="logo-img">
            <h1 class="logo-text">IndieForge</h1>
        </div>
        <span id="user-badge" class="badge">Dev Mode</span>
    </header>

    <main>
        <section id="workspaces-section">
            <h2>Mes Tableaux de Bord</h2>
            <div id="workspaces-container" class="space-y">
                <p class="italic-text">Chargement des espaces de travail...</p>
            </div>
        </section>

        <section id="dashboard-section" class="hidden">
            <button id="btn-back" class="btn-link">⬅ Retour aux projets</button>
            <h2 id="dashboard-title">Studio Dashboard</h2>
            <div id="dashboard-content" class="space-y"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
